<!doctype html>
<html lang="en">
  <head>
    <title>Pomodoro Clock</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <script defer src="./js.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container justify-content-center">
        <h1 class="logo">Pomodoro Focus</h1>
      </div>
    </nav>

    <main class="container py-4 py-md-5">
      <section class="hero text-center">
        <p class="eyebrow">Study timer</p>
        <h2 id="main-title">Ready to focus?</h2>
        <p class="hero-text">
          Choose your session and break time, then start your focus cycle.
        </p>
      </section>

      <section class="clock-body row g-4 align-items-center">
        <div class="length col-12 col-lg-4">
          <div class="length-card">
            <h3>Break length</h3>

            <div class="controls">
              <button class="control-button" type="button" id="break-decrement">
                -
              </button>
              <span id="break-length">5</span>
              <button class="control-button" type="button" id="break-increment">
                +
              </button>
            </div>
          </div>

          <div class="length-card">
            <h3>Session length</h3>

            <div class="controls">
              <button class="control-button" type="button" id="session-decrement">
                -
              </button>
              <span id="session-length">25</span>
              <button class="control-button" type="button" id="session-increment">
                +
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="timer mx-auto">
            <p class="timer-label" id="timer-label">Session</p>
            <p class="time-left" id="time-left">25:00</p>

            <div class="timer-actions">
              <button class="btn btn-light" type="button" id="start_stop">
                Start
              </button>
              <button class="btn btn-outline-light" type="button" id="reset">
                Reset
              </button>
            </div>
          </div>
        </div>

        <aside class="col-12 col-lg-4">
          <div class="quote-card">
            <p class="eyebrow">API quote</p>
            <blockquote id="quote-text">
              Click start to load a focus quote.
            </blockquote>
            <p id="quote-author">-</p>
            <button class="btn btn-success" type="button" id="new-quote">
              New quote
            </button>
          </div>
        </aside>
      </section>
    </main>

    <audio id="alarm" src="./bell.wav" preload="auto"></audio>
  </body>
</html>

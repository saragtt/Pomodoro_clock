<!doctype html>
<html lang="en">
  <head>
    <title>Pomodoro Clock</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <script defer src="./js.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <h1 class="logo">Pomodoro Clock</h1>
    </nav>

    <h1 id="main-title">Let's start!</h1>

    <div class="clock-body">
      <div class="length">
        <div class="break-length-box">
          <h2>Break</h2>
          <h2>Length</h2>

          <div class="controls">
            <button class="break-length-button" value="-" id="break-decrement">
              -
            </button>
            <span id="break-length">5</span>
            <button class="break-length-button" value="+" id="break-increment">
              +
            </button>
          </div>
        </div>
        <div class="session-length-box">
          <h2>Session</h2>
          <h2>Length</h2>

          <div class="controls">
            <button
              class="session-length-button"
              value="-"
              id="session-decrement"
            >
              -
            </button>
            <span id="session-length">25</span>
            <button
              class="session-length-button"
              value="+"
              id="session-increment"
            >
              +
            </button>
          </div>
        </div>
      </div>

      <div class="timer">
        <p class="start-session" id="timer-label">Session</p>
        <button class="start-session-button" value="start" id="start_stop">
          Start
        </button>
        <p class="end-session" id="time-left">25:00</p>
        <button class="reset-session-button" value="reset" id="reset">
          Reset
        </button>
      </div>
    </div>
    <audio id="alarm" src="./bell.wav"></audio>
  </body>
</html>
